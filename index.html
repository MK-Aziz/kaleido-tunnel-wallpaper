<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleido Tunnel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 16px; color: #f88; font: 12px/1.4 monospace; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>

<script>
/* =====================================================================
   Kaleido Tunnel - live wallpaper (Lively Wallpaper / any browser)
   WebGL2 port of a multi-pass Shadertoy:
     Buffer A : ray-marched kaleidoscopic tunnel
     Buffer B : bloom mip-tree
     Buffer C : horizontal gaussian blur
     Buffer D : vertical gaussian blur
     Image    : bloom composite + tonemapping
   ===================================================================== */

// ---------- user settings (changed live by Lively's Customise panel) ----------
const settings = {
  speed: 1.0,        // animation speed multiplier
  symmetry: true,    // "sym" in the original
  megamod: false,    // "megamod" in the original
  hearts: false,     // "iqheart" in the original
  palette: -1,       // -1 = cycle through all 7 palettes, 0..6 = lock one
  bloom: 0.12,       // bloom strength (original: 0.12)
  scale: 0.75,       // internal render resolution
  fps: 60            // 0 = unlimited
};

// ---------------------------------------------------------------- shaders
const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const HEADER = `#version 300 es
precision highp float;
precision highp int;
uniform vec3  iResolution;
uniform float iTime;
uniform sampler2D iChannel0;
uniform sampler2D iChannel3;
uniform int   uSym;
uniform int   uHeart;
uniform int   uMega;
uniform int   uPalette;
uniform float uBloom;
out vec4 outColor;
vec3 saturate(vec3 x) { return clamp(x, vec3(0.0), vec3(1.0)); }
`;

const FOOTER = `
void main() {
  vec4 c = vec4(0.0);
  mainImage(c, gl_FragCoord.xy);
  outColor = c;
}`;

// ---------------- Buffer A : the tunnel -----------------
const BUFFER_A = `
#define sym uSym
#define iqheart uHeart
#define megamod uMega

vec3 pal(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
  return a + b * cos(6.28318 * (c * t + d));
}
vec3 sphericalToCartesian(vec3 p) {
  return vec3(p.x * sin(p.y) * cos(p.z),
              p.x * sin(p.y) * sin(p.z),
              p.x * cos(p.y));
}
vec3 cartestianToSpherical(vec3 p) {
  float d = length(p);
  return vec3(d, acos(p.z / d), sign(p.y) * acos(p.x / length(p.xy)));
}
mat2 rotate2d(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }
float hash11(float n) { return fract(sin(n) * 43758.5453); }
vec2 hash22(vec2 p) {
  p = vec2(dot(p, vec2(175.1, 311.7)), dot(p, vec2(260.5, 752.3)));
  return fract(sin(p + 455.) * 18.5453);
}
float sdTorus(vec3 p, vec2 t) { return length(vec2(length(p.xz) - t.x, p.y)) - t.y; }

float yuid = 0.;

float sdTunnelDepth(in vec3 p, out vec3 matData, float time, float tid) {
  matData = vec3(0.0);
  float ty = 5.5;
  p.z = mod(p.z + time * -18., ty) - ty / 2.;
  if (sym == 1) {
    p.xz = -abs(p.xz);
    p.xy *= rotate2d(iTime);
    p.xz = -abs(p.xz);
    p.xy *= rotate2d(iTime / 4. + 12.);
    p.xz = -abs(p.xz);
    p.xy *= rotate2d(iTime / 8. + 3.);
    p.xz = -abs(p.xz);
    p.xy *= rotate2d(iTime / -3. + 4.);
    p.xz = -abs(p.xz);
    p.xy *= rotate2d(iTime / -7. + 5.);
    p.xz = -abs(p.xz);
  }
  p.xy *= rotate2d(p.z / 1.5);
  p.xy *= rotate2d(time * 2.);
  float r = 4.;
  p = cartestianToSpherical(p);
  p.z *= 3.; p.z += time * -12.;
  p = sphericalToCartesian(p);
  if (megamod == 1) p = mod(p, r) - r / 2.;
  p.z += time * -6.;

  float u = 3.;
  float v = 1.;
  if (tid == 0.) {
    p.x += sin(p.z * 6. * u) / 11. + sin(p.z / 11. + 1.7) / 2. * v;
    p.y += cos(p.z * 1. * u + time * 3.) / 2. * v;
    p.y += sin(p.z * 2. * u + cos(time * 6.) * 2.) / 4. * v;
    p.x += cos(p.z * .5 * u) / 24. * v;
  }

  vec3 p1 = p;
  vec3 p2 = p;

  // spherical space
  vec3 ps = cartestianToSpherical(p1);
  float id = floor(ps.z / .2245);
  matData.x = ps.z / 2. + p.z / 2. + time / .1;
  if (tid == 0.) matData.x += 1.;

  ps.z *= 2.;
  ps.z = mod(ps.z, .2245) - 1.7;
  p1 = sphericalToCartesian(ps);
  matData.y = id;
  p1.y += 1.5;

  // per-cylinder transformation
  p1.x += cos(p.z * 3.5 * hash11(id / 32.) * 21.14) / 12.;
  p1.y += cos(p.z * 2. * hash11(id / 12.)) / 5.;

  float rep = .051;
  p.z += sin(p.x * 1.) / 2.5;
  p.z += time * -1.;
  p.z = mod(p.z, rep) - rep / 2.;
  float tdist = sdTorus(p.xzy, vec2(1.5, .0005));

  vec3 pp = p2;
  r = .92;
  pp.xy *= rotate2d(time * -12.);
  pp.x -= 11.5;
  pp = mod(pp, r) - r / 2.;
  float ppdist = length(pp) - .02;
  return min(min(length(p1.xy) - .05, tdist), ppdist);
}

float sdTunnel(in vec3 p, out vec3 matData) {
  float time = iTime / 2.;
  return sdTunnelDepth(p, matData, -time / 6. + yuid * 330.1123, 0.);
}

vec2 map(in vec3 pos, out vec3 matData) {
  float d = sdTunnel(pos, matData);
  return vec2(d, 1.0);
}

vec2 castRay(in vec3 ro, in vec3 rd, out vec3 matData) {
  vec2 res = vec2(-1.0, -1.0);
  float tmin = .11;
  float tmax = 30.0;
  float t = tmin;
  matData = vec3(0.0);
  for (int i = 0; i < 150 && t < tmax; i++) {
    vec2 h = map(ro + rd * t, matData);
    if (abs(h.x) < (0.01 * t)) { res = vec2(t, h.y); break; }
    t += h.x * .3;
  }
  return res;
}

vec3 calcNormal(in vec3 pos) {
  vec3 t;
  vec2 e = vec2(1.0, -1.0) * 0.5773 * 0.0005;
  return normalize(e.xyy * map(pos + e.xyy, t).x +
                   e.yyx * map(pos + e.yyx, t).x +
                   e.yxy * map(pos + e.yxy, t).x +
                   e.xxx * map(pos + e.xxx, t).x);
}

vec3 palN(int i, float x) {
  if (i == 0) return pal(x, vec3(.5), vec3(.5), vec3(1.0),           vec3(0.0, 0.33, 0.67));
  if (i == 1) return pal(x, vec3(.5), vec3(.5), vec3(1.0),           vec3(0.0, 0.10, 0.20));
  if (i == 2) return pal(x, vec3(.5), vec3(.5), vec3(1.0),           vec3(0.3, 0.20, 0.20));
  if (i == 3) return pal(x, vec3(.5), vec3(.5), vec3(1.0, 1.0, 0.5), vec3(0.8, 0.90, 0.30));
  if (i == 4) return pal(x, vec3(.5), vec3(.5), vec3(1.0, 0.7, 0.4), vec3(0.0, 0.15, 0.20));
  if (i == 5) return pal(x, vec3(.5), vec3(.5), vec3(2.0, 1.0, 0.0), vec3(0.5, 0.20, 0.25));
  return pal(x, vec3(0.8, 0.5, 0.4), vec3(0.2, 0.4, 0.2), vec3(2.0, 1.0, 1.0), vec3(0.0, 0.25, 0.25));
}

vec3 getcol(float x1) {
  float x = fract(x1);
  if (uPalette >= 0) return palN(uPalette, x);
  float x2 = mod(iTime / 3. + yuid * 4., 7.);
  int i0 = int(x2);
  return mix(palN(i0, x), palN((i0 + 1) % 7, x), fract(x2));
}

vec3 render(in vec3 ro, in vec3 rd, vec2 uv) {
  vec3 col = vec3(0.0);
  vec3 matData;
  vec2 res = castRay(ro, rd, matData);
  float t = res.x;
  if (t > 0.0) {
    vec3 pos = ro + rd * t;
    vec3 nor = calcNormal(pos);
    vec3 albedo = getcol(matData.x);
    col = albedo * vec3(.9, .5, .5) *
          max(.1, dot(normalize(pos - normalize(vec3(100.0, 1000.0, 100.0))), nor));
    col *= exp(t * -.1);
    int id = abs(int(matData.y));
    if (id % 22 == 0)      col *= 5. + 10. * float(sym);
    else if (id % 8 == 0)  col *= 2. + 5. * float(sym);
  } else {
    col = .3 * pow(texture(iChannel0, uv + vec2(iTime / 16., 0.)).xyz, vec3(5.));
  }
  return col * (1. + smoothstep(.1, .05, length(uv)) * 20. * float(sym == 1));
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec3 ro = vec3(0.0, 0.0, -4.0);
  vec2 p = (-iResolution.xy + 2.0 * fragCoord) / iResolution.y;

  if (iqheart == 1) {
    float rr = 2.;
    p.y += -iTime * 2. + float(p.x > 0.);
    vec2 ids = hash22(floor(p / rr));
    yuid = ids.x;
    p = mod(p, rr) - rr / 2.;
  }

  vec3 rd = normalize(vec3(p.xy, .5));
  vec3 col = render(ro, rd, p.xy);
  col = pow(col, vec3(1.2545));

  if (iqheart == 1) {
    float tt = mod(iTime, 1.5) / 1.5;
    float ss = pow(tt, .2) * 0.5 + 0.5;
    ss = 1.0 + ss * 0.5 * sin(tt * 6.2831 * 3.0 + p.y * 0.5) * exp(-tt * 4.0);
    p *= vec2(0.5, 1.5) + ss * vec2(0.5, -0.5);
    p.y -= 0.25;
    float a = atan(p.x, p.y) / 3.141593;
    float r = length(p);
    float h = abs(a);
    float d = (13.0 * h - 22.0 * h * h + 10.0 * h * h * h) / (6.0 - 5.0 * h);
    float s = 0.75 + 0.75 * p.x;
    s *= 1.0 - 0.4 * r;
    s = 0.3 + 0.7 * s;
    s *= 0.5 + 0.5 * pow(1.0 - clamp(r / d, 0.0, 1.0), 0.1);
    vec3 hcol = vec3(2, 0.2 * r, 0.3) / 15. * s / .5;
    col = mix(hcol / 4., col, min(1., max(0.0, 5. * (d - r))));
  }
  fragColor = vec4(saturate(col), 1.0);
}`;

// ---------------- Buffer B : bloom mip-tree -----------------
const BUFFER_B = `
vec3 ColorFetch(vec2 coord) { return texture(iChannel0, coord).rgb; }

vec3 Grab1(vec2 coord, const float octave, const vec2 offset) {
  float scale = exp2(octave);
  coord += offset; coord *= scale;
  if (coord.x < 0.0 || coord.x > 1.0 || coord.y < 0.0 || coord.y > 1.0) return vec3(0.0);
  return ColorFetch(coord);
}

#define GRAB_N(NAME, N) \
vec3 NAME(vec2 coord, const float octave, const vec2 offset) { \
  float scale = exp2(octave); \
  coord += offset; coord *= scale; \
  if (coord.x < 0.0 || coord.x > 1.0 || coord.y < 0.0 || coord.y > 1.0) return vec3(0.0); \
  vec3 color = vec3(0.0); \
  for (int i = 0; i < N; i++) \
    for (int j = 0; j < N; j++) { \
      vec2 off = (vec2(i, j) / iResolution.xy) * scale / float(N); \
      color += ColorFetch(coord + off); \
    } \
  return color / float(N * N); \
}
GRAB_N(Grab4, 4)
GRAB_N(Grab8, 8)
GRAB_N(Grab16, 16)

vec2 CalcOffset(float octave) {
  vec2 offset = vec2(0.0);
  vec2 padding = vec2(10.0) / iResolution.xy;
  offset.x = -min(1.0, floor(octave / 3.0)) * (0.25 + padding.x);
  offset.y = -(1.0 - (1.0 / exp2(octave))) - padding.y * octave;
  offset.y += min(1.0, floor(octave / 3.0)) * 0.35;
  return offset;
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 uv = fragCoord.xy / iResolution.xy;
  vec3 color = vec3(0.0);
  color += Grab1 (uv, 1.0, vec2(0.0));
  color += Grab4 (uv, 2.0, CalcOffset(1.0));
  color += Grab8 (uv, 3.0, CalcOffset(2.0));
  color += Grab16(uv, 4.0, CalcOffset(3.0));
  color += Grab16(uv, 5.0, CalcOffset(4.0));
  color += Grab16(uv, 6.0, CalcOffset(5.0));
  color += Grab16(uv, 7.0, CalcOffset(6.0));
  color += Grab16(uv, 8.0, CalcOffset(7.0));
  fragColor = vec4(color, 1.0);
}`;

// ---------------- Buffer C / D : separable gaussian blur -----------------
const blurPass = (dir, limit) => `
const float weights[5] = float[5](0.19638062, 0.29675293, 0.09442139, 0.01037598, 0.00025940);
const float offsets[5] = float[5](0.00000000, 1.41176471, 3.29411765, 5.17647059, 7.05882353);
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 uv = fragCoord.xy / iResolution.xy;
  vec3 color = vec3(0.0);
  float weightSum = 0.0;
  if (uv.x < ${limit}) {
    color += texture(iChannel0, uv).rgb * weights[0];
    weightSum += weights[0];
    for (int i = 1; i < 5; i++) {
      vec2 offset = vec2(offsets[i]) / iResolution.xy;
      color += texture(iChannel0, uv + offset * ${dir}).rgb * weights[i];
      color += texture(iChannel0, uv - offset * ${dir}).rgb * weights[i];
      weightSum += weights[i] * 2.0;
    }
    color /= weightSum;
  }
  fragColor = vec4(color, 1.0);
}`;
const BUFFER_C = blurPass('vec2(0.5, 0.0)', '1.12');
const BUFFER_D = blurPass('vec2(0.0, 0.5)', '0.52');

// ---------------- Image : bloom composite + grading -----------------
const IMAGE = `
vec4 cubic(float x) {
  float x2 = x * x, x3 = x2 * x;
  vec4 w;
  w.x =   -x3 + 3.0*x2 - 3.0*x + 1.0;
  w.y =  3.0*x3 - 6.0*x2       + 4.0;
  w.z = -3.0*x3 + 3.0*x2 + 3.0*x + 1.0;
  w.w =  x3;
  return w / 6.0;
}
vec4 BicubicTexture(in sampler2D tex, in vec2 coord) {
  vec2 resolution = iResolution.xy;
  coord *= resolution;
  float fx = fract(coord.x), fy = fract(coord.y);
  coord.x -= fx; coord.y -= fy;
  fx -= 0.5; fy -= 0.5;
  vec4 xcubic = cubic(fx), ycubic = cubic(fy);
  vec4 c = vec4(coord.x - 0.5, coord.x + 1.5, coord.y - 0.5, coord.y + 1.5);
  vec4 s = vec4(xcubic.x + xcubic.y, xcubic.z + xcubic.w, ycubic.x + ycubic.y, ycubic.z + ycubic.w);
  vec4 offset = c + vec4(xcubic.y, xcubic.w, ycubic.y, ycubic.w) / s;
  vec4 sample0 = texture(tex, vec2(offset.x, offset.z) / resolution);
  vec4 sample1 = texture(tex, vec2(offset.y, offset.z) / resolution);
  vec4 sample2 = texture(tex, vec2(offset.x, offset.w) / resolution);
  vec4 sample3 = texture(tex, vec2(offset.y, offset.w) / resolution);
  float sx = s.x / (s.x + s.y);
  float sy = s.z / (s.z + s.w);
  return mix(mix(sample3, sample2, sx), mix(sample1, sample0, sx), sy);
}
vec3 Grab(vec2 coord, const float octave, const vec2 offset) {
  float scale = exp2(octave);
  coord /= scale; coord -= offset;
  return BicubicTexture(iChannel3, coord).rgb;
}
vec2 CalcOffset(float octave) {
  vec2 offset = vec2(0.0);
  vec2 padding = vec2(10.0) / iResolution.xy;
  offset.x = -min(1.0, floor(octave / 3.0)) * (0.25 + padding.x);
  offset.y = -(1.0 - (1.0 / exp2(octave))) - padding.y * octave;
  offset.y += min(1.0, floor(octave / 3.0)) * 0.35;
  return offset;
}
vec3 GetBloom(vec2 coord) {
  vec3 bloom = vec3(0.0);
  bloom += Grab(coord, 1.0, CalcOffset(0.0)) * 1.0;
  bloom += Grab(coord, 2.0, CalcOffset(1.0)) * 1.5;
  bloom += Grab(coord, 3.0, CalcOffset(2.0)) * 1.0;
  bloom += Grab(coord, 4.0, CalcOffset(3.0)) * 1.5;
  bloom += Grab(coord, 5.0, CalcOffset(4.0)) * 1.8;
  bloom += Grab(coord, 6.0, CalcOffset(5.0)) * 1.0;
  bloom += Grab(coord, 7.0, CalcOffset(6.0)) * 1.0;
  bloom += Grab(coord, 8.0, CalcOffset(7.0)) * 1.0;
  return bloom;
}
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 uv = fragCoord.xy / iResolution.xy;
  vec3 color = texture(iChannel0, uv).rgb;
  color += GetBloom(uv) * uBloom;
  color *= 2.0;
  // tonemapping and color grading
  color = pow(color, vec3(1.5));
  color = color / (1.0 + color);
  color = pow(color, vec3(1.0 / 1.5));
  color = mix(color, color * color * (3.0 - 2.0 * color), vec3(1.0));
  color = pow(color, vec3(1.3, 1.20, 1.0));
  color = saturate(color * 1.01);
  color = pow(color, vec3(0.7 / 2.2));
  fragColor = vec4(color, 1.0);
}`;

// ---------------------------------------------------------------- WebGL
const canvas = document.getElementById('c');
const errBox = document.getElementById('err');
const fail = msg => { errBox.style.display = 'block'; errBox.textContent = msg; throw new Error(msg); };

const gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: false,
  powerPreference: 'high-performance'
});
if (!gl) fail('WebGL2 is not available.');
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => location.reload());

const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
const FMT = hasFloat
  ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT }
  : { internal: gl.RGBA8,   type: gl.UNSIGNED_BYTE };

function compile(type, src, name) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(`${name}:\n${gl.getShaderInfoLog(s)}`);
  return s;
}
function program(body, name) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT, name + ' (vs)'));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HEADER + body + FOOTER, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail(`${name} link:\n${gl.getProgramInfoLog(p)}`);
  const u = {};
  for (const n of ['iResolution', 'iTime', 'iChannel0', 'iChannel3', 'uSym', 'uHeart', 'uMega', 'uPalette', 'uBloom'])
    u[n] = gl.getUniformLocation(p, n);
  return { p, u };
}

const progs = {
  A: program(BUFFER_A, 'Buffer A'),
  B: program(BUFFER_B, 'Buffer B'),
  C: program(BUFFER_C, 'Buffer C'),
  D: program(BUFFER_D, 'Buffer D'),
  I: program(IMAGE, 'Image')
};

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// 256x256 RGBA noise texture (stands in for the Shadertoy noise channel used for the background)
const noiseTex = (() => {
  const N = 256, data = new Uint8Array(N * N * 4);
  let s = 1337;
  for (let i = 0; i < data.length; i++) { s = (s * 1664525 + 1013904223) >>> 0; data[i] = s >>> 24; }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return t;
})();

function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, FMT.internal, w, h, 0, gl.RGBA, FMT.type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb };
}

let W = 0, H = 0, targets = null;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(16, Math.floor(window.innerWidth * dpr * settings.scale));
  const h = Math.max(16, Math.floor(window.innerHeight * dpr * settings.scale));
  if (w === W && h === H && targets) return;
  W = canvas.width = w;
  H = canvas.height = h;
  if (targets) for (const t of Object.values(targets)) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
  targets = { A: makeTarget(W, H), B: makeTarget(W, H), C: makeTarget(W, H), D: makeTarget(W, H) };
}
window.addEventListener('resize', resize);
resize();

let time = 0;
const TIME_WRAP = 2100; // keeps float precision healthy when running for days

function pass(prog, target, ch0, ch3) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(prog.p);
  const u = prog.u;
  gl.uniform3f(u.iResolution, W, H, 1);
  gl.uniform1f(u.iTime, time);
  gl.uniform1i(u.uSym, settings.symmetry ? 1 : 0);
  gl.uniform1i(u.uHeart, settings.hearts ? 1 : 0);
  gl.uniform1i(u.uMega, settings.megamod ? 1 : 0);
  gl.uniform1i(u.uPalette, settings.palette);
  gl.uniform1f(u.uBloom, settings.bloom);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ch0);
  gl.uniform1i(u.iChannel0, 0);
  if (ch3) { gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, ch3); gl.uniform1i(u.iChannel3, 3); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function draw() {
  pass(progs.A, targets.A, noiseTex);
  pass(progs.B, targets.B, targets.A.tex);
  pass(progs.C, targets.C, targets.B.tex);
  pass(progs.D, targets.D, targets.C.tex);
  pass(progs.I, null, targets.A.tex, targets.D.tex);
}

let lastFrame = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (settings.fps > 0 && now - lastFrame < 1000 / settings.fps - 2) return;
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  time = (time + dt * settings.speed) % TIME_WRAP;
  draw();
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- Lively hook
// Lively calls this with values from LivelyProperties.json
// (slider -> number, checkbox -> bool, dropdown -> selected index).
const SCALES = [1.0, 0.75, 0.5, 0.35];
const FPS = [60, 30, 0];
function livelyPropertyListener(name, val) {
  switch (name) {
    case 'speed':    settings.speed = +val; break;
    case 'symmetry': settings.symmetry = !!val; break;
    case 'megamod':  settings.megamod = !!val; break;
    case 'hearts':   settings.hearts = !!val; break;
    case 'palette':  settings.palette = (+val) - 1; break;      // 0 = "Cycle", 1..7 = fixed
    case 'bloom':    settings.bloom = +val; break;
    case 'quality':  settings.scale = SCALES[+val] ?? 1; resize(); break;
    case 'fps':      settings.fps = FPS[+val] ?? 60; break;
  }
}
window.livelyPropertyListener = livelyPropertyListener;
</script>
